[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x3ui"
version = "0.1.1"
description = "Typed Python client for the 3x-ui panel API, generated from OpenAPI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vadim Reznichenko", email = "vahellame@gmail.com" }]
keywords = ["3x-ui", "xui", "xray", "openapi", "api-client", "vpn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.23.0,<0.29.0",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0",
    "typing-extensions>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/vahellame/x3ui"
Repository = "https://github.com/vahellame/x3ui"
Issues = "https://github.com/vahellame/x3ui/issues"

[tool.hatch.build.targets.wheel]
packages = ["x3ui"]

[tool.hatch.build.targets.sdist]
include = ["x3ui", "openapi.json", "README.md", "LICENSE"]
