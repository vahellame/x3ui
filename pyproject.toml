[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x3ui"
version = "0.1.0"
description = "Typed Python client for the 3x-ui panel API, generated from OpenAPI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["3x-ui", "xui", "xray", "openapi", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.23.0,<0.29.0",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/USERNAME/x3ui"
Issues = "https://github.com/USERNAME/x3ui/issues"

[tool.hatch.build.targets.wheel]
packages = ["x3ui"]
